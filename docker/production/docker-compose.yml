name: biljettera

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt expiry notices}
      ADMIN_HOST: ${ADMIN_HOST:-admin.biljettera.se}
      PUBLIC_HOST: ${PUBLIC_HOST:-demo.biljettera.se}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build:
      context: ../..
      dockerfile: Dockerfile.all-in-one
    image: biljettera/app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${BILJETTERA_ENV_FILE:-/srv/biljettera/.env}
    volumes:
      - ${SWISH_SECRETS_DIR:-/srv/biljettera/secrets/swish}:/etc/hievents/swish:ro
      - app-storage:/app/backend/storage/app
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hievents}
      POSTGRES_USER: ${POSTGRES_USER:-hievents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a unique generated value}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hievents} -d $${POSTGRES_DB:-hievents}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD to a unique generated value}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

volumes:
  caddy-data:
  caddy-config:
  app-storage:
  pgdata:
  redisdata:
